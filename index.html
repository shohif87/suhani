<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suhani Shop |</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-[#f57224] text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <a href="#" class="text-2xl font-extrabold tracking-wider">SUHANI</a>
            
            <div class="relative w-full md:w-1/2">
                <div class="flex">
                    <input type="text" id="search-box" oninput="showSuggestions()" placeholder="পণ্য সার্চ করুন..." class="w-full px-4 py-2 text-black rounded-l-lg focus:outline-none text-sm">
                    <button class="bg-[#d0611e] px-6 rounded-r-lg hover:bg-[#b85317] transition"><i class="fas fa-search"></i></button>
                </div>
                <div id="suggestion-box" class="absolute left-0 right-0 bg-white text-black mt-1 rounded-lg shadow-2xl hidden max-h-60 overflow-y-auto z-50 border border-gray-200"></div>
            </div>

            <button onclick="toggleCart()" class="relative bg-[#d0611e] px-5 py-2 rounded-lg hover:bg-[#b85317] transition flex items-center gap-2">
                <i class="fas fa-shopping-cart text-lg"></i>
                <span class="hidden md:inline font-bold text-sm">কার্ট</span>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-yellow-400 text-black text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <div class="bg-amber-100 text-amber-800 text-center py-2 text-xs font-semibold shadow-sm flex items-center justify-center gap-2">
        <i class="fas fa-bullhorn"></i> আমাদের যেকোনো পণ্য অর্ডারে ক্যাশ অন ডেলিভারি সুবিধা!
    </div>

    <main class="container mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-gray-800 border-l-4 border-[#f57224] pl-2">আপনার জন্য পণ্যসমূহ (For You)</h2>
            <button onclick="resetSearch()" id="reset-btn" class="text-sm text-blue-600 font-semibold hidden hover:underline">সব পণ্য দেখুন</button>
        </div>
        
        <div id="product-list" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-4">
            </div>
    </main>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
            <h3 class="font-bold text-lg"><i class="fas fa-shopping-bag mr-2 text-[#f57224]"></i>আপনার শপিং কার্ট</h3>
            <button onclick="toggleCart()" class="text-2xl hover:text-red-400">&times;</button>
        </div>
        
        <div id="cart-items" class="p-4 flex-1 overflow-y-auto space-y-4">
            <p class="text-gray-500 text-center py-8">আপনার কার্টটি খালি আছে।</p>
        </div>
        
        <div class="p-4 border-t border-gray-200 bg-gray-50 space-y-3">
            <div class="flex justify-between text-gray-700 text-sm">
                <span>পণ্যের মোট মূল্য:</span>
                <span>৳<span id="cart-total">0</span></span>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">ডেলিভারি এলাকা (মডিফাই করা যাবে):</label>
                <select id="delivery-location" onchange="updateTotalWithShipping()" class="w-full p-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-[#f57224]">
                    <option value="120">ঢাকার বাইরে / হোম ডেলিভারি (৳১২০)</option>
                    <option value="180">স্পেশাল কুরিয়ার / প্রত্যন্ত অঞ্চল (৳১৮০)</option>
                </select>
            </div>
            
            <div class="border-t pt-2 flex justify-between font-extrabold text-lg text-gray-900">
                <span>সর্বমোট বিল:</span>
                <span class="text-[#f57224]">৳<span id="grand-total">0</span></span>
            </div>

            <div class="bg-red-50 p-2 rounded-lg border border-red-200 text-xs text-red-700">
                👉 <strong>বিকাশ/নগদ (Personal):</strong> 017XXXXXXXX নম্বরে টাকা পাঠিয়ে অর্ডার ফর্মে TrxID দিন।
            </div>
            
            <button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition shadow">
                <i class="fas fa-check-circle mr-1"></i> অর্ডার কনফার্ম করুন
            </button>
        </div>
    </div>

    <div id="product-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-2xl font-bold text-gray-500 hover:text-black">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        // ডেমো পণ্য তালিকা (যখন ড্যাশবোর্ড সেটআপ শেষ হবে, তখন এগুলো অটোমেটিক আপনার ড্যাশবোর্ড থেকে আসবে)
        const products = [
            { id: 1, name: "【Toy life hall】 Tweeter Speaker 200W High Quality", price: 2695, image: "https://images.unsplash.com/photo-1612444530582-fc66183b16f7?w=400", desc: "দারুণ বেস এবং ক্লিয়ার সাউন্ডের জন্য সেরা স্পিকার টুইটার।", reviews: [{user: "রিয়াদ", rating: 5, text: "অসাধারণ সাউন্ড!"}] },
            { id: 2, name: "Bellotta Can Cat Food - Real Tuna Chicken In Jelly 400g", price: 220, image: "https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=400", desc: "বিড়ালদের জন্য সুস্বাদু এবং পুষ্টিকর টুনা ফিশ জেলি খাবার।", reviews: [{user: "সুহানি", rating: 4, text: "আমার বিড়াল খুব পছন্দ করেছে।"}] }
        ];

        let cart = [];

        function displayProducts(data) {
            const container = document.getElementById('product-list');
            container.innerHTML = '';
            data.forEach(p => {
                container.innerHTML += `
                    <div class="bg-white rounded-lg shadow-sm hover:shadow-md transition flex flex-col justify-between p-3 border border-gray-100 cursor-pointer" onclick="openProduct(${p.id})">
                        <img src="${p.image}" class="w-full h-36 md:h-44 object-cover rounded-md mb-2">
                        <div>
                            <h3 class="text-xs md:text-sm font-medium text-gray-800 line-clamp-2 h-8 mb-1">${p.name}</h3>
                            <div class="text-[#f57224] font-bold text-base md:text-lg">৳${p.price}</div>
                        </div>
                        <button onclick="event.stopPropagation(); addToCart(${p.id})" class="w-full bg-[#f57224] text-white py-1.5 rounded-md text-xs font-bold mt-2 hover:bg-[#e05f13] transition">কার্টে যোগ করুন</button>
                    </div>
                `;
            });
        }

        function showSuggestions() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const box = document.getElementById('suggestion-box');
            if(!query) { box.classList.add('hidden'); return; }
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            if(filtered.length === 0) { box.classList.add('hidden'); return; }
            box.innerHTML = '';
            filtered.forEach(p => {
                box.innerHTML += `<div onclick="selectProduct('${p.name}')" class="p-3 hover:bg-orange-50 cursor-pointer border-b text-xs md:text-sm text-gray-700 flex items-center gap-2"><i class="fas fa-search text-gray-400"></i> ${p.name}</div>`;
            });
            box.classList.remove('hidden');
        }

        function selectProduct(name) {
            document.getElementById('search-box').value = name;
            document.getElementById('suggestion-box').classList.add('hidden');
            const filtered = products.filter(p => p.name === name);
            displayProducts(filtered);
            document.getElementById('reset-btn').classList.remove('hidden');
        }

        function resetSearch() {
            document.getElementById('search-box').value = '';
            displayProducts(products);
            document.getElementById('reset-btn').classList.add('hidden');
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('translate-x-full');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const exists = cart.find(item => item.id === id);
            if(exists) { exists.quantity++; } else { cart.push({...product, quantity: 1}); }
            updateCart();
            document.getElementById('cart-sidebar').classList.remove('translate-x-full');
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.quantity, 0);
            const container = document.getElementById('cart-items');
            if(cart.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-8">আপনার কার্টটি খালি আছে।</p>`;
                document.getElementById('cart-total').innerText = 0;
                document.getElementById('grand-total').innerText = 0;
                return;
            }
            container.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.quantity;
                container.innerHTML += `
                    <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                        <div class="flex items-center gap-3">
                            <img src="${item.image}" class="w-12 h-12 object-cover rounded-md">
                            <div>
                                <h4 class="text-xs font-bold text-gray-800 line-clamp-1">${item.name}</h4>
                                <p class="text-xs text-[#f57224] font-semibold">৳${item.price} x ${item.quantity}</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-gray-400 hover:text-red-500 transition px-2"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = total;
            updateTotalWithShipping();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCart();
        }

        function updateTotalWithShipping() {
            const total = parseInt(document.getElementById('cart-total').innerText);
            const shipping = parseInt(document.getElementById('delivery-location').value);
            document.getElementById('grand-total').innerText = total > 0 ? (total + shipping) : 0;
        }

        // কাস্টমার রিভিউ ও ডিটেইলস পপআপ
        function openProduct(id) {
            const p = products.find(prod => prod.id === id);
            const modal = document.getElementById('product-modal');
            const content = document.getElementById('modal-content');
            
            let reviewHTML = '';
            p.reviews.forEach(r => {
                reviewHTML += `
                    <div class="bg-gray-50 p-2.5 rounded-lg text-xs mt-2 border border-gray-100">
                        <div class="flex justify-between font-bold text-gray-700"><span>${r.user}</span> <span class="text-yellow-500">⭐ ${r.rating}/5</span></div>
                        <p class="text-gray-600 mt-1">${r.text}</p>
                    </div>
                `;
            });

            content.innerHTML = `
                <img src="${p.image}" class="w-full h-56 object-cover rounded-xl mb-4 shadow-sm">
                <h3 class="text-base font-bold text-gray-900 mb-1">${p.name}</h3>
                <div class="text-[#f57224] font-extrabold text-xl mb-3">৳${p.price}</div>
                <p class="text-xs text-gray-600 leading-relaxed mb-4 bg-orange-50 p-3 rounded-lg border border-orange-100">${p.desc}</p>
                
                <div class="border-t pt-3">
                    <h4 class="text-xs font-bold text-gray-800 mb-2"><i class="fas fa-comments text-orange-400"></i> ক্রেতাদের রিভিউ (${p.reviews.length})</h4>
                    ${reviewHTML}
                </div>
                <button onclick="addToCart(${p.id}); closeModal();" class="w-full bg-[#f57224] text-white py-2.5 rounded-lg font-bold text-sm mt-5 hover:bg-[#e05f13] transition shadow">কার্টে যোগ করুন</button>
            `;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function checkout() {
            if(cart.length === 0) { alert('আপনার কার্ট খালি!'); return; }
            const grandTotal = document.getElementById('grand-total').innerText;
            
            // হোয়াটসঅ্যাপ অর্ডার অটোমেশন (ক্লিক করলেই আপনার নাম্বারে ডিটেইলস চলে আসবে)
            let message = `🛒 *নতুন অর্ডার সুহানি শপ*\n\n`;
            cart.forEach(item => { message += `▪️ ${item.name} (Qty: ${item.quantity})\n`; });
            message += `\n💵 *সর্বমোট বিল (কুরিয়ারসহ):* ৳${grandTotal}\n\nদয়া করে আপনার নাম, ঠিকানা এবং পেমেন্ট TrxID লিখে মেসেজটি পাঠান।`;
            
            const whatsappNumber = "8801895287543"; // 👈 এখানে আপনার মোবাইল নাম্বারটি দিন
             const whatsappNumber = "8801895287543"; // 👈 এখানে আপনার মোবাইল নাম্বারটি দিন
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // Netlify Identity-র লগইন উইজেট সেটিংস
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
                }
            });
        }

        displayProducts(products);
    </script>
</body>
</html>
